<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>에러가 발생했습니다</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        h1 { color: #d9534f; }
    </style>
</head>
<body>
    <h1>오류가 발생했습니다</h1>
    <div th:if="${message}">
        <p>상태 코드: <span th:text="${status}"></span></p>
        <p>에러 내용: <span th:text="${error}"></span></p>
        <p>메시지: <span th:text="${message}"></span></p>
    </div>
    <p th:unless="${message}">죄송합니다. 요청하신 페이지를 찾을 수 없거나 서버에 문제가 발생했습니다.</p>
    <a href="/">홈으로 돌아가기</a>
</body>
</html>
