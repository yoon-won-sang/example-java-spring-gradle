<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시물 목록</title>
</head>
<body>
    <table border="1" style="border-collapse: collapse; width: 100%;">
        <tr>
            <th>번호</th><th>사용자ID</th><th>게시물제목</th><th>분류</th><th>상태</th>
            <th>작성자</th><th>작성일</th><th>조회수</th><th>좋아요</th><th>태그</th>
        </tr>
        <tr th:each="post : ${posts}">
            <td th:text="${post.id}"></td>
            <td th:text="${post.userId}"></td>
            <td th:text="'게시물 ' + ${post.id} + '번의 한글 제목입니다.'"></td>
            <td th:text="${post.category}"></td>
            <td th:text="${post.status}"></td>
            <td th:text="${post.author}"></td>
            <td th:text="${post.date}"></td>
            <td th:text="${post.views}"></td>
            <td th:text="${post.likes}"></td>
            <td th:text="${post.tags}"></td>
        </tr>
    </table>
</body>
</html>
